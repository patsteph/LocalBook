[package]
name = "localbooklm"
version = "2.3.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "localbooklm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "multipart", "stream"] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tokio-util = { version = "0.7", features = ["io"] }

# Do not strip build scripts and proc-macro dylibs.
#
# rustc compiles a proc-macro to a native .dylib and `dlopen`s it while compiling the crates
# that USE it. Strip that dylib and the load fails, which surfaces as
# `error[E0463]: can't find crate for <ctor_proc_macro | tauri_macros | time_macros | …>` —
# a message that points at a missing crate when the crate compiled fine and only the load
# failed. It hits every proc-macro at once and only on the machine doing the stripping, so it
# reads like a broken toolchain.
#
# This is the fix for the E0463 hunt in COLLABORATION_NOTES.md, found on one Mac in Sept 2026.
# It is NOT a rustc version pin — those notes warn against pinning for exactly this symptom,
# because a pin adds a failure surface without addressing the dylib load.
#
# Only build-time artifacts are affected; the shipped app binary is untouched, and this is a
# no-op on machines that were never stripping.
[profile.release.build-override]
strip = false
