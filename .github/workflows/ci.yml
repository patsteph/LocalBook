name: CI

on:
  push:
    branches: [ master, dev ]
  pull_request:

jobs:
  pyinstaller-hidden-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check PyInstaller hidden-import drift
        run: python scripts/check_pyinstaller_hidden_imports.py

  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile all backend Python (syntax sweep)
        # Mirrors release.sh Step 1 pre-flight py_compile; pure stdlib, no backend deps.
        run: python -m compileall -q backend -x '(\.venv|/build/)'

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install frontend deps
        run: npm ci
      - name: Type-check (tsc --noEmit)
        # Mirrors release.sh Step 1 pre-flight; catches unused-import/type errors esbuild skips.
        run: npx tsc --noEmit

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install slim test deps
        # Slim set (no mlx/torch/lancedb/langgraph) — see backend/requirements-test.txt.
        run: pip install -r backend/requirements-test.txt
      - name: Run unit tier (CI-pure pre-existing checks)
        run: cd backend && python -m pytest tests/ -v

