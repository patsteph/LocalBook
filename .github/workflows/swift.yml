# The native Swift side of LocalBook: the shared package, the Mac app and the iPhone app (docs/swift-migration/).
# Runs only when those trees change; the Python and TypeScript checks stay in ci.yml.
#
# Three macOS jobs run side by side, so a run takes as long as its slowest job (the Mac app). Each job restores
# its compiled dependencies (MLX, mlx-swift-lm, FluidAudio, ...) from the Actions cache, keyed on the Xcode version
# and the package pins, so a push that only changes LocalBook's own sources recompiles only those.
name: Swift

on:
  push:
    branches: [ master, dev ]
    paths:
      - 'swift/**'
      - 'mac/**'
      - 'ios/**'
      - 'scripts/ci/**'
      - '.github/workflows/swift.yml'
  pull_request:
    paths:
      - 'swift/**'
      - 'mac/**'
      - 'ios/**'
      - 'scripts/ci/**'
      - '.github/workflows/swift.yml'
  workflow_dispatch:

# A newer push to the same branch supersedes the run in flight; PR runs are grouped by PR.
concurrency:
  group: swift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The plan fixes stable Xcode 27.2. The runner may only have another 27.x; the select step takes the newest
  # stable 27 it finds and falls back to the image default, printing what it chose.
  WANTED_XCODE_MAJOR: "27"

jobs:
  core-macos:
    name: LocalBookCore on macOS (build + Swift Testing)
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: swift/LocalBookCore
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        id: xcode
        working-directory: .
        run: |
          ./scripts/ci/select-xcode.sh "$WANTED_XCODE_MAJOR"
          echo "version=$(xcodebuild -version | tr -d ' ' | paste -sd- -)" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM checkouts and build
        uses: actions/cache@v4
        with:
          path: |
            swift/LocalBookCore/.build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-core-${{ steps.xcode.outputs.version }}-${{ hashFiles('swift/LocalBookCore/Package.swift', 'swift/LocalBookCore/Package.resolved') }}
          restore-keys: spm-core-${{ steps.xcode.outputs.version }}-

      - name: Resolve
        run: swift package resolve

      - name: Build (both libraries)
        # Xcode 27's new SwiftPM build system fails to link some header-only dependencies; the plan says to use
        # the native one where that happens. Older toolchains have no such flag.
        run: |
          if swift build --help 2>/dev/null | grep -q -- '--build-system'; then
            swift build --build-system native -c debug
          else
            swift build -c debug
          fi

      - name: Test (Swift Testing)
        run: |
          if swift build --help 2>/dev/null | grep -q -- '--build-system'; then
            swift test --build-system native
          else
            swift test
          fi

  mac-app:
    name: LocalBook for Mac (xcodegen + xcodebuild)
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mac/LocalBook
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        id: xcode
        working-directory: .
        run: |
          ./scripts/ci/select-xcode.sh "$WANTED_XCODE_MAJOR"
          echo "version=$(xcodebuild -version | tr -d ' ' | paste -sd- -)" >> "$GITHUB_OUTPUT"
      - name: Install xcodegen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate the project without the uncommitted reranker model
        # The same two optional entries the iOS job drops (see below): the model lives only on Patrick's Mac.
        run: |
          python3 - <<'PY'
          import re
          p = 'project.yml'; s = open(p).read()
          s = re.sub(r'      - path: [^\n]*tools/cache/[^\n]*\n        optional: true\n', '', s)
          open(p, 'w').write(s)
          PY
          grep -c 'tools/cache' project.yml && exit 1 || true
          xcodegen generate
      - name: Cache DerivedData (package checkouts + compiled dependencies)
        # Whole derived-data folder, keyed on the toolchain and the package pins, so the cache changes only when a
        # dependency does. A hit leaves MLX and friends compiled; the checkout gives LocalBook's own files new
        # timestamps, so Xcode rebuilds exactly those. Logs and the index are left out (big, useless here).
        uses: actions/cache@v4
        with:
          path: |
            mac/LocalBook/.derived
            !mac/LocalBook/.derived/Logs
            !mac/LocalBook/.derived/Index.noindex
          key: derived-mac-${{ steps.xcode.outputs.version }}-${{ hashFiles('swift/LocalBookCore/Package.swift', 'swift/LocalBookCore/Package.resolved', 'mac/LocalBook/project.yml') }}
          restore-keys: derived-mac-${{ steps.xcode.outputs.version }}-
      - name: Build
        run: |
          xcodebuild build -project LocalBook.xcodeproj -scheme LocalBook -destination 'platform=macOS' \
            -derivedDataPath .derived CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            -skipPackagePluginValidation -skipMacroValidation -quiet

  ios-app:
    # Building the iPhone app compiles LocalBookCore for iOS too, so there is no separate package-for-iOS job.
    name: LocalBook for iPhone (unsigned build, checks the package extraction)
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios/LocalBookLab
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        id: xcode
        working-directory: .
        run: |
          ./scripts/ci/select-xcode.sh "$WANTED_XCODE_MAJOR"
          echo "version=$(xcodebuild -version | tr -d ' ' | paste -sd- -)" >> "$GITHUB_OUTPUT"
      - name: Install xcodegen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate the project without the uncommitted reranker model
        # tools/cache/RerankerL12.mlpackage (64 MB) and rerank_conformance.json live only on Patrick's Mac; the app
        # builds without them (it then skips reranking). xcodegen's `optional` still writes the file reference, and
        # coremlc fails on a missing model, so CI drops those entries before generating.
        run: |
          python3 - <<'PY'
          import re
          p = 'project.yml'; s = open(p).read()
          s = re.sub(r'      - path: tools/cache/[^\n]*\n        optional: true\n', '', s)
          open(p, 'w').write(s)
          PY
          grep -c 'tools/cache' project.yml && exit 1 || true
          xcodegen generate
      - name: Cache DerivedData (package checkouts + compiled dependencies)
        # Same idea as the Mac job: dependencies stay compiled across runs, LocalBook's own files rebuild.
        uses: actions/cache@v4
        with:
          path: |
            ios/LocalBookLab/.derived
            !ios/LocalBookLab/.derived/Logs
            !ios/LocalBookLab/.derived/Index.noindex
          key: derived-ios-${{ steps.xcode.outputs.version }}-${{ hashFiles('swift/LocalBookCore/Package.swift', 'swift/LocalBookCore/Package.resolved', 'ios/LocalBookLab/project.yml') }}
          restore-keys: derived-ios-${{ steps.xcode.outputs.version }}-
      - name: Build the LocalBook app for a device, unsigned
        # The app targets iOS 27; until the runner ships Xcode 27 its AVFAudio iOS 27 calls cannot compile here.
        # scripts/ci/ios-sdk-gap.py lets exactly those through and fails on anything else, so the job still proves
        # that the app builds against the extracted package.
        run: |
          set -o pipefail
          if xcodebuild build -project LocalBookLab.xcodeproj -scheme LocalBook -destination 'generic/platform=iOS' \
            -derivedDataPath .derived CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            -skipPackagePluginValidation -skipMacroValidation -quiet 2>&1 | tee build.log; then
            echo "Built outright (this Xcode has the iOS 27 SDK)."
          else
            python3 ../../scripts/ci/ios-sdk-gap.py build.log
          fi
