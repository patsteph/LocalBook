# LocalBook for Mac: the native Swift app built around the phone's engine (docs/swift-migration/).
# Generate the Xcode project with:  brew install xcodegen && xcodegen generate
#
# Phase 2: a sync peer (pairs with the Python Mac, copies its notebooks, asks them with the package's engine).
# The engine comes from the local package ../../swift/LocalBookCore, which the iOS app will also depend on.
name: LocalBook
options:
  bundleIdPrefix: com.patsteph.localbook
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  xcodeVersion: "27.2"

packages:
  LocalBookCore:
    path: ../../swift/LocalBookCore
  # Linked by the app itself for the read-aloud voice and the meeting recorder (Kokoro, the speaker and speech
  # models), as the iPhone app does; same pin as the package.
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    from: "0.17.6"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Set your team here or in Xcode › Signing & Capabilities. Never commit a team id.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

schemes:
  LocalBook:
    build:
      targets:
        LocalBook: all
    run:
      config: Debug
    test:
      config: Debug
      targets: []

targets:
  LocalBook:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      # The reranker, shared with the iPhone app: a Core ML conversion of the Python Mac's own model
      # (ios/LocalBookLab/tools/convert_reranker.py writes it). Not committed (64 MB); the app builds without it and
      # then skips reranking, as the phone does. CI strips these entries before generating the project.
      - path: ../../ios/LocalBookLab/tools/cache/RerankerL12.mlpackage
        optional: true
      - path: ../../ios/LocalBookLab/Models/RerankerTokenizer
        type: folder
      - path: ../../ios/LocalBookLab/tools/cache/rerank_conformance.json
        optional: true
    dependencies:
      - package: LocalBookCore
        product: LocalBookCore
      - package: LocalBookCore
        product: LocalBookEngines
      - package: FluidAudio
        product: FluidAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.patsteph.localbook.mac
        PRODUCT_NAME: LocalBook
        MARKETING_VERSION: "3.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    entitlements:
      path: Resources/LocalBook.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Phone link and Mac-to-Mac sync: this app both calls peers and listens for them.
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        # Sources the user drags in or picks, and exports the user saves.
        com.apple.security.files.user-selected.read-write: true
        # Meetings and voice notes.
        com.apple.security.device.audio-input: true
        # Scanning pages with the Mac camera (the phone does most of it; the Mac can too).
        com.apple.security.device.camera: true
        # Letting the user grant a folder once (the folder watcher) and keep it across launches.
        com.apple.security.files.bookmarks.app-scope: true
        # The pairing key lives in the Secure Enclave, in the data-protection Keychain. macOS opens that only to an
        # app whose App ID entitlement is authorised by a provisioning profile; a Team alone is not enough, since
        # Xcode embeds a profile in a Mac app only for a capability that needs one. Keychain Sharing, with just our
        # own group, is that capability. Without it pairing fails with -34018.
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.patsteph.localbook.mac
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: LocalBook
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: © 2026 Patrick Stephens
        ITSAppUsesNonExemptEncryption: false
        # The import talks to the old LocalBook on this Mac over plain HTTP on loopback (its own port, with its token).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: LocalBook finds and syncs with your other Macs and your iPhone on this network.
        NSBonjourServices:
          - _localbook._tcp
        NSMicrophoneUsageDescription: LocalBook listens when you dictate a note or record a meeting.
        NSSpeechRecognitionUsageDescription: LocalBook turns your dictation into text, on this Mac.
        NSCameraUsageDescription: LocalBook photographs pages and whiteboards so the text can be added to a notebook.
        # "Open with LocalBook" in the Finder and drops on the Dock icon: the kinds a notebook drop takes. Alternate
        # rank, so LocalBook never becomes a file's default app.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
              - org.openxmlformats.wordprocessingml.document
              - com.microsoft.word.doc
              - public.rtf
              - com.apple.rtfd
              - org.oasis-open.opendocument.text
              - public.html
              - com.apple.webarchive
              - public.plain-text
              - public.comma-separated-values-text
              - org.openxmlformats.spreadsheetml.sheet
              - org.openxmlformats.presentationml.presentation
              - com.microsoft.excel.xls
              - com.microsoft.powerpoint.ppt
              - org.oasis-open.opendocument.spreadsheet
              - org.idpf.epub-container
              - public.svg-image
              - public.json
              - public.image
              - public.audio
              - public.movie
        # localbook://record and the other links the phone and the widgets already use.
        CFBundleURLTypes:
          - CFBundleURLName: com.patsteph.localbook.mac
            CFBundleURLSchemes:
              - localbook
