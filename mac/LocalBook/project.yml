# LocalBook for Mac: the native Swift app built around the phone's engine (docs/swift-migration/).
# Generate the Xcode project with:  brew install xcodegen && xcodegen generate
#
# Phase 0: the shell (window, sidebar, empty Ask view, menu bar map, Settings). Phase 2 fills it in as a sync peer.
# The engine comes from the local package ../../swift/LocalBookCore, which the iOS app will also depend on.
name: LocalBook
options:
  bundleIdPrefix: com.patsteph.localbook
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  xcodeVersion: "27.2"

packages:
  LocalBookCore:
    path: ../../swift/LocalBookCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Set your team here or in Xcode › Signing & Capabilities. Never commit a team id.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

schemes:
  LocalBook:
    build:
      targets:
        LocalBook: all
    run:
      config: Debug
    test:
      config: Debug
      targets: []

targets:
  LocalBook:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    dependencies:
      - package: LocalBookCore
        product: LocalBookCore
      - package: LocalBookCore
        product: LocalBookEngines
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.patsteph.localbook.mac
        PRODUCT_NAME: LocalBook
        MARKETING_VERSION: "3.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    entitlements:
      path: Resources/LocalBook.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Phone link and Mac-to-Mac sync: this app both calls peers and listens for them.
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        # Sources the user drags in or picks, and exports the user saves.
        com.apple.security.files.user-selected.read-write: true
        # Meetings and voice notes.
        com.apple.security.device.audio-input: true
        # Scanning pages with the Mac camera (the phone does most of it; the Mac can too).
        com.apple.security.device.camera: true
        # Letting the user grant a folder once (the folder watcher) and keep it across launches.
        com.apple.security.files.bookmarks.app-scope: true
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: LocalBook
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: © 2026 Patrick Stephens
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: LocalBook finds and syncs with your other Macs and your iPhone on this network.
        NSBonjourServices:
          - _localbook._tcp
        NSMicrophoneUsageDescription: LocalBook listens when you dictate a note or record a meeting.
        NSSpeechRecognitionUsageDescription: LocalBook turns your dictation into text, on this Mac.
        NSCameraUsageDescription: LocalBook photographs pages and whiteboards so the text can be added to a notebook.
        # localbook://record and the other links the phone and the widgets already use.
        CFBundleURLTypes:
          - CFBundleURLName: com.patsteph.localbook.mac
            CFBundleURLSchemes:
              - localbook
